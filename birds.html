  <style>
    /* Layout: app shell. Thin header, map on the left, species field guide on the right.
       Colors and fonts come from assets/css/fieldnotes.css. */
    :root { --hdr-h: 60px; --side-w: 360px; --tr: 0.15s ease; }
    html, body { height: 100%; }
    body { font-size: 14.5px; overflow: hidden; }
    button, input { font: inherit; color: inherit; }

    /* ---- Header ---- */
    .pg-header {
      height: var(--hdr-h); display: flex; align-items: center; gap: 18px;
      padding: 0 20px; border-bottom: 1px solid var(--line);
      background: var(--bg); position: relative; z-index: 600;
    }
    .back-link {
      display: inline-flex; align-items: center; gap: 6px;
      font-family: var(--f-mono); font-size: 12px; letter-spacing: 0.05em; text-transform: uppercase;
      color: var(--muted); transition: color var(--tr);
    }
    .back-link svg { width: 14px; height: 14px; transition: transform 0.2s ease; }
    .back-link:hover { color: var(--accent); }
    .back-link:hover svg { transform: translateX(-2px); }
    .hdr-rule { width: 1px; height: 22px; background: var(--line); }
    /* Same treatment as the name on the homepage: body sans, semibold, one color. */
    .pg-header h1 {
      margin: 0; font-family: var(--f-body); font-weight: 600;
      font-size: 21px; letter-spacing: -0.025em; line-height: 1; color: var(--fg);
    }
    .hdr-right { margin-left: auto; display: flex; align-items: center; gap: 18px; }
    .hdr-stats { display: flex; gap: 16px; font-family: var(--f-mono); font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
    .hdr-stats strong { color: var(--fg); font-weight: 400; }

    /* ---- Layout ---- */
    .app { display: flex; height: calc(100% - var(--hdr-h)); }
    .map-pane { flex: 1 1 auto; position: relative; min-width: 0; }
    #map { position: absolute; inset: 0; background: var(--bg); }

    /* Basemaps: Esri grey canvas, warmed slightly so it sits with the palette.
       Which one is visible is set from JS (Leaflet writes layer opacity inline). */
    .tiles-light { filter: sepia(0.1) saturate(0.6) brightness(0.995); }
    .tiles-dark { filter: sepia(0.28) saturate(0.8) brightness(1.2); }

    /* Leaflet chrome in the site's style */
    .leaflet-container { font-family: var(--f-body); background: var(--bg); }
    .leaflet-bar { border: 1px solid var(--line) !important; border-radius: 12px !important; overflow: hidden; box-shadow: 0 6px 18px -12px var(--shadow) !important; }
    .leaflet-bar a, .leaflet-bar a:hover { width: 32px !important; height: 32px !important; line-height: 30px !important; background: var(--surface); color: var(--fg); border-bottom-color: var(--line) !important; font-weight: 400; }
    .leaflet-bar a:hover { color: var(--accent); }
    .leaflet-touch .leaflet-control-zoom-in, .leaflet-touch .leaflet-control-zoom-out { font-size: 18px; }
    .leaflet-control-attribution { background: var(--glass) !important; color: var(--faint) !important; font: 10.5px/1.6 var(--f-mono) !important; border-radius: 8px 0 0 0; padding: 1px 8px !important; }
    .leaflet-control-attribution a { color: var(--muted) !important; }
    .leaflet-attribution-flag { display: none !important; }

    /* ---- Map overlays ---- */
    .map-reset {
      position: absolute; top: 14px; right: 14px; z-index: 500;
      display: inline-flex; align-items: center; gap: 6px;
      background: var(--surface); border: 1px solid var(--line); border-radius: 999px;
      padding: 7px 14px; font-family: var(--f-mono); font-size: 11.5px; letter-spacing: 0.05em; text-transform: uppercase;
      color: var(--muted); cursor: pointer; box-shadow: 0 6px 18px -12px var(--shadow);
      opacity: 0; transform: translateY(-4px); pointer-events: none;
      transition: opacity 0.2s ease, transform 0.2s ease, color var(--tr), border-color var(--tr);
    }
    .map-reset.visible { opacity: 1; transform: none; pointer-events: auto; }
    .map-reset:hover { color: var(--accent); border-color: var(--accent); }

    .map-legend {
      background: var(--glass); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
      border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px 10px;
      color: var(--fg); box-shadow: 0 10px 24px -16px var(--shadow); min-width: 190px;
    }
    .legend-title { font-family: var(--f-mono); font-size: 10.5px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--faint); margin-bottom: 8px; }
    .legend-item { display: grid; grid-template-columns: 10px minmax(0, 1fr) auto; align-items: center; gap: 9px; padding: 3px 0; font-size: 12.5px; color: var(--muted); }
    .legend-count { font-family: var(--f-mono); font-size: 11.5px; color: var(--faint); font-variant-numeric: tabular-nums; text-align: right; }
    .legend-dot { width: 10px; height: 10px; border-radius: 50%; box-shadow: 0 0 0 2px var(--surface); }

    .map-attribution {
      position: absolute; bottom: 14px; left: 14px; z-index: 500;
      background: var(--glass); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
      border: 1px solid var(--line); border-radius: 999px;
      padding: 5px 12px; font-family: var(--f-mono); font-size: 10.5px; color: var(--faint);
    }
    .map-attribution a { color: var(--muted); border-bottom: 1px solid var(--line); }
    .map-attribution a:hover { color: var(--accent); border-color: var(--accent); }

    /* ---- Hover tooltip ---- */
    .leaflet-tooltip {
      background: var(--surface) !important; color: var(--fg) !important;
      border: 1px solid var(--line) !important; border-radius: 12px !important;
      box-shadow: 0 14px 30px -16px var(--shadow) !important;
      padding: 10px 12px !important; pointer-events: none !important;
    }
    .leaflet-tooltip-top::before { border-top-color: var(--line) !important; }
    .tip-photo { display: block; width: 120px; height: 90px; object-fit: cover; border-radius: 8px; margin-bottom: 8px; }
    .tip-name { font-weight: 600; font-size: 13.5px; }
    .tip-sci { font-size: 12px; font-style: italic; color: var(--muted); }
    .tip-loc { display: flex; align-items: center; gap: 6px; margin-top: 4px; font-family: var(--f-mono); font-size: 11px; color: var(--faint); }
    .tip-loc i { width: 7px; height: 7px; border-radius: 50%; }

    /* ---- Sidebar ---- */
    .sidebar {
      flex: 0 0 var(--side-w); display: flex; flex-direction: column; min-width: 0;
      border-left: 1px solid var(--line); background: var(--surface);
    }
    .side-head { padding: 14px 16px 10px; display: grid; gap: 10px; border-bottom: 1px solid var(--line); }
    .search { position: relative; }
    .search svg { position: absolute; left: 12px; top: 50%; width: 15px; height: 15px; transform: translateY(-50%); color: var(--faint); pointer-events: none; }
    .search input {
      width: 100%; height: 36px; padding: 0 12px 0 34px;
      border: 1px solid var(--line); border-radius: 999px; background: var(--bg);
      font-size: 13.5px; outline: none; transition: border-color var(--tr), box-shadow var(--tr);
    }
    .search input::placeholder { color: var(--faint); }
    .search input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
    .side-meta { display: flex; justify-content: space-between; font-family: var(--f-mono); font-size: 10.5px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--faint); }

    .species-list { flex: 1 1 auto; overflow-y: auto; padding: 6px 8px 16px; scrollbar-width: thin; scrollbar-color: var(--line) transparent; }

    .species-card {
      display: flex; align-items: center; gap: 12px;
      padding: 8px; border-radius: 12px; cursor: pointer;
      transition: background-color var(--tr);
    }
    .species-card + .species-card { margin-top: 2px; }
    .species-card:hover { background: var(--bg); }
    .species-card.active { background: var(--accent-soft); }
    .species-card.active .sp-name { color: var(--accent); }
    .species-card:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }

    .sp-photo, .sp-placeholder { width: 52px; height: 52px; border-radius: 10px; flex-shrink: 0; }
    .sp-photo { object-fit: cover; display: block; background: var(--bg); }
    .sp-placeholder { display: grid; place-items: center; background: var(--bg); color: var(--faint); border: 1px solid var(--line); }
    .sp-placeholder svg { width: 20px; height: 20px; }
    .sp-info { min-width: 0; flex: 1; display: grid; gap: 1px; }
    .sp-name { font-size: 14px; font-weight: 600; color: var(--fg); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; transition: color var(--tr); }
    .sp-sci { font-size: 12px; font-style: italic; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .sp-meta { display: flex; flex-wrap: wrap; gap: 2px 10px; margin-top: 3px; font-size: 11.5px; color: var(--faint); }
    .sp-region { display: inline-flex; align-items: center; gap: 5px; }
    .sp-region i { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }

    .empty { padding: 40px 16px; text-align: center; color: var(--muted); font-size: 13.5px; }

    @media (max-width: 760px) {
      body { overflow: auto; }
      .app { flex-direction: column; height: auto; }
      .map-pane { flex: 0 0 auto; height: 46vh; }
      .sidebar { flex: 1 1 auto; border-left: none; border-top: 1px solid var(--line); height: 60vh; }
      .hdr-stats, .hdr-rule { display: none; }
      .pg-header { gap: 12px; padding: 0 16px; }
      .pg-header h1 { font-size: 19px; }
      .map-legend { display: none; }
      .map-attribution { display: none; }
    }
  </style>
</head>

  const REGION_COLORS = {
    'US-MA': '#2f6b46',
    'CA-SK': '#4a80a0',
    'CA-MB': '#c37b89',
    'CA-ON': '#a07840',
    'US-CA': '#8060a8',
    'CA-BC': '#2f9aa0',
    'US-NJ': '#c2622f',
    'US-NV': '#b8942a'
  };
  const REGION_LABELS = {
    'US-MA': 'Massachusetts',
    'CA-SK': 'Saskatchewan',
    'CA-MB': 'Manitoba',
    'CA-ON': 'Ontario',
    'US-CA': 'California',
    'CA-BC': 'British Columbia',
    'US-NJ': 'New Jersey',
    'US-NV': 'Nevada'
  };

  // Build species index
  const speciesMap = new Map();
  OBS.forEach(o => {
    if (!speciesMap.has(o.name)) speciesMap.set(o.name, {name: o.name, sci: o.sci, obs: []});
    speciesMap.get(o.name).obs.push(o);
  });
  const allSpecies = [...speciesMap.values()].sort((a, b) => a.name.localeCompare(b.name));

  // Stats
  document.getElementById('stat-sp').textContent = allSpecies.length;
  document.getElementById('stat-rg').textContent = new Set(OBS.map(o => o.region)).size;

  // Map
  const map = L.map('map', {zoomControl: true});
  // Esri Light Gray Canvas: keyless, and split into a base layer plus a
  // separate labels overlay. Native tiles stop at z16, so maxNativeZoom lets
  // Leaflet upscale rather than go blank if someone zooms in past that.
  const esriOpts = {
    attribution: 'Tiles &copy; <a href="https://www.esri.com/">Esri</a> &mdash; Esri, DeLorme, NAVTEQ',
    maxNativeZoom: 16,
    maxZoom: 18
  };
  const esriTile = name => `https://services.arcgisonline.com/ArcGIS/rest/services/Canvas/${name}/MapServer/tile/{z}/{y}/{x}`;
  const lightTiles = [
    L.tileLayer(esriTile('World_Light_Gray_Base'), {...esriOpts, className: 'tiles-light'}),
    L.tileLayer(esriTile('World_Light_Gray_Reference'), {...esriOpts, attribution: '', className: 'tiles-light'})
  ];
  const darkTiles = [
    L.tileLayer(esriTile('World_Dark_Gray_Base'), {...esriOpts, attribution: '', className: 'tiles-dark'}),
    L.tileLayer(esriTile('World_Dark_Gray_Reference'), {...esriOpts, attribution: '', className: 'tiles-dark'})
  ];
  [...lightTiles, ...darkTiles].forEach(l => l.addTo(map));
  // Show the basemap for the current theme. Both stay loaded so switching never waits on tiles.
  function syncBasemap() {
    const dark = window.siteTheme && window.siteTheme.current() === 'dark';
    lightTiles.forEach(l => l.setOpacity(dark ? 0 : 1));
    darkTiles.forEach(l => l.setOpacity(dark ? 1 : 0));
  }
  syncBasemap();
  // On phones the credits pill is hidden; carry its credits in Leaflet's attribution line instead.
  if (window.matchMedia('(max-width: 760px)').matches) {
    map.attributionControl.addAttribution('IDs via <a href="https://merlin.allaboutbirds.org/" target="_blank" rel="noopener">Merlin</a> · Photos <a href="https://commons.wikimedia.org/" target="_blank" rel="noopener">Wikimedia</a>');
  }

  // Marker outlines use the page surface color so dots read on both basemaps.
  const markerStroke = () => getComputedStyle(document.documentElement).getPropertyValue('--surface').trim() || '#fff';

  // Region species counts (unique species per region, for the legend).
  // Each species is credited to only one region — wherever it was first
  // logged (earliest entry in OBS) — so seeing the same bird again in a
  // different region later doesn't double-count it.
  const regionSpeciesCount = {};
  const creditedSpecies = new Set();
  OBS.forEach(o => {
    if (creditedSpecies.has(o.name)) return;
    creditedSpecies.add(o.name);
    if (!regionSpeciesCount[o.region]) regionSpeciesCount[o.region] = new Set();
    regionSpeciesCount[o.region].add(o.name);
  });

  // Legend
  const legend = L.control({position: 'bottomright'});
  legend.onAdd = () => {
    const div = L.DomUtil.create('div', 'map-legend');
    const regions = [...new Set(OBS.map(o => o.region))];
    div.innerHTML = '<div class="legend-title">Region · first sightings</div>' +
      regions.map(r => {
        const color = REGION_COLORS[r] || '#90969d';
        const count = regionSpeciesCount[r] ? regionSpeciesCount[r].size : 0;
        return `<div class="legend-item">
          <span class="legend-dot" style="background:${color}"></span>
          <span>${REGION_LABELS[r]||r}</span>
          <span class="legend-count">${count}</span>
        </div>`;
      }).join('');
    return div;
  };
  legend.addTo(map);

  // Markers
  let activeSpecies = null;
  const markerData = {}; // id -> {marker, obs}
  const markerGroup = L.featureGroup().addTo(map);

  OBS.forEach(o => {
    const color = REGION_COLORS[o.region] || '#90969d';
    const m = L.circleMarker([o.lat, o.lon], {
      radius: 6, fillColor: color, color: markerStroke(),
      weight: 1.5, fillOpacity: 0.85, pane: 'markerPane', interactive: false
    });
    markerData[o.id] = {marker: m, obs: o};
    m.addTo(markerGroup);
  });

  map.fitBounds(markerGroup.getBounds().pad(0.08));

  // Hover follows whichever point is nearest the cursor, not just whichever
  // dot happens to be on top — lets you sweep across a tight cluster and
  // have the tooltip switch between overlapping points as you move.
  const HOVER_PX_RADIUS = 20;
  let hoverTooltip = null;
  let hoverId = null;

  function nearestObs(containerPoint) {
    let best = null, bestDist = Infinity;
    Object.entries(markerData).forEach(([id, d]) => {
      const pt = map.latLngToContainerPoint([d.obs.lat, d.obs.lon]);
      const dist = pt.distanceTo(containerPoint);
      if (dist < bestDist) { bestDist = dist; best = {id, obs: d.obs}; }
    });
    return best && bestDist <= HOVER_PX_RADIUS ? best : null;
  }

  function showHoverTooltip(obs) {
    const photo = photoCache.get(obs.name);
    const color = REGION_COLORS[obs.region] || '#90969d';
    const html = `
      ${photo ? `<img class="tip-photo" src="${photo}" alt="">` : ''}
      <div class="tip-name">${obs.name}</div>
      <div class="tip-sci">${obs.sci}</div>
      <div class="tip-loc"><i style="background:${color}"></i>${obs.loc} · ${REGION_LABELS[obs.region] || obs.region}</div>
    `;
    if (!hoverTooltip) {
      hoverTooltip = L.tooltip({direction: 'top', offset: [0, -7], opacity: 1, sticky: false});
    }
    hoverTooltip.setLatLng([obs.lat, obs.lon]).setContent(html);
    if (!map.hasLayer(hoverTooltip)) hoverTooltip.addTo(map);
  }

  function hideHoverTooltip() {
    if (hoverTooltip && map.hasLayer(hoverTooltip)) map.removeLayer(hoverTooltip);
    hoverId = null;
  }

  map.on('mousemove', e => {
    const found = nearestObs(e.containerPoint);
    if (found) {
      if (found.id !== hoverId) {
        hoverId = found.id;
        showHoverTooltip(found.obs);
      }
    } else if (hoverId) {
      hideHoverTooltip();
    }
  });
  map.on('mouseout', hideHoverTooltip);
  map.on('click', e => {
    const found = nearestObs(e.containerPoint);
    if (found) selectSpecies(found.obs.name, true);
  });

  function selectSpecies(name, scrollSidebar = true) {
    activeSpecies = name;
    Object.values(markerData).forEach(({marker, obs}) => {
      const regionColor = REGION_COLORS[obs.region] || '#90969d';
      if (obs.name === name) {
        marker.setStyle({fillColor: regionColor, fillOpacity: 1, radius: 9, weight: 2.5, color: markerStroke()});
        marker.setZIndexOffset(500);
      } else {
        marker.setStyle({fillColor: regionColor, fillOpacity: 0.85, radius: 6, weight: 1.5, color: markerStroke()});
        marker.setZIndexOffset(0);
      }
    });
    const sel = Object.values(markerData).filter(d => d.obs.name === name).map(d => d.marker);
    if (sel.length) {
      const g = L.featureGroup(sel);
      const b = g.getBounds();
      const ne = b.getNorthEast(), sw = b.getSouthWest();
      if (Math.abs(ne.lat - sw.lat) < 0.001 && Math.abs(ne.lng - sw.lng) < 0.001) {
        map.setView(b.getCenter(), 14);
      } else {
        map.fitBounds(b.pad(0.5), {maxZoom: 14});
      }
    }
    document.getElementById('mapReset').classList.add('visible');
    document.querySelectorAll('.species-card').forEach(c => c.classList.toggle('active', c.dataset.name === name));
    if (scrollSidebar) {
      setTimeout(() => {
        const card = document.querySelector(`.species-card[data-name="${CSS.escape(name)}"]`);
        const list = document.getElementById('speciesList');
        if (card && list) {
          const cardRect = card.getBoundingClientRect();
          const listRect = list.getBoundingClientRect();
          const target = list.scrollTop + cardRect.top - listRect.top - (list.clientHeight - card.offsetHeight) / 2;
          list.scrollTo({top: Math.max(0, target), behavior: 'smooth'});
        }
      }, 100);
    }
  }

  function resetAll() {
    activeSpecies = null;
    Object.values(markerData).forEach(({marker, obs}) => {
      marker.setStyle({fillColor: REGION_COLORS[obs.region]||'#90969d', fillOpacity: 0.85, radius: 6, weight: 1.5, color: markerStroke()});
      marker.setZIndexOffset(0);
    });
    map.fitBounds(markerGroup.getBounds().pad(0.08));
    document.getElementById('mapReset').classList.remove('visible');
    document.querySelectorAll('.species-card').forEach(c => c.classList.remove('active'));
  }
  document.getElementById('mapReset').addEventListener('click', resetAll);
  document.addEventListener('themechange', () => {
    syncBasemap();
    Object.values(markerData).forEach(({marker}) => marker.setStyle({color: markerStroke()}));
  });

  // Photo cache
  const photoCache = new Map();
  const photoElMap = new Map(); // name -> current DOM element

  const FEATHER_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.2 3.8c-4.9-.6-9.6 1.4-12.3 5.4-1.6 2.4-2.2 5.3-1.8 8.2L4 21"/><path d="M6.1 17.4c3.6.2 7-1.3 9.4-4.1 2.3-2.7 3.6-6 4.7-9.5"/><path d="M9.3 13.6h5.2M11.6 9.6h5.6"/></svg>';

  function buildSpeciesList(filter) {
    const q = (filter || '').toLowerCase();
    const list = document.getElementById('speciesList');
    list.innerHTML = '';
    const filtered = allSpecies.filter(s =>
      s.name.toLowerCase().includes(q) || s.sci.toLowerCase().includes(q)
    );
    const countEl = document.getElementById('listCount');
    countEl.textContent = q ? `${filtered.length} of ${allSpecies.length} species` : `${allSpecies.length} species`;
    if (!filtered.length) {
      list.innerHTML = '<div class="empty">No species match that search.</div>';
      return;
    }
    filtered.forEach(s => {
      const regions = [...new Set(s.obs.map(o => o.region))];
      const card = document.createElement('div');
      card.className = 'species-card' + (activeSpecies === s.name ? ' active' : '');
      card.dataset.name = s.name;
      card.tabIndex = 0;
      card.setAttribute('role', 'button');

      let photoEl;
      if (photoCache.has(s.name)) {
        photoEl = document.createElement('img');
        photoEl.className = 'sp-photo';
        photoEl.src = photoCache.get(s.name);
        photoEl.alt = s.name;
      } else {
        photoEl = document.createElement('div');
        photoEl.className = 'sp-placeholder';
        photoEl.innerHTML = FEATHER_SVG;
      }
      photoElMap.set(s.name, photoEl);

      const info = document.createElement('div');
      info.className = 'sp-info';
      info.innerHTML = `
        <div class="sp-name">${s.name}</div>
        <div class="sp-sci">${s.sci}</div>
        <div class="sp-meta">${regions.map(r => `<span class="sp-region"><i style="background:${REGION_COLORS[r] || '#90969d'}"></i>${REGION_LABELS[r] || r}</span>`).join('')}</div>
      `;
      card.appendChild(photoEl);
      card.appendChild(info);
      const choose = () => {
        if (activeSpecies === s.name) resetAll();
        else selectSpecies(s.name, false);
      };
      card.addEventListener('click', choose);
      card.addEventListener('keydown', e => {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); choose(); }
      });
      list.appendChild(card);
    });
  }

  buildSpeciesList('');

  document.getElementById('searchInput').addEventListener('input', function() {
    buildSpeciesList(this.value);
  });

  // Wikipedia photos
  async function loadPhotos() {
    const names = allSpecies.map(s => s.name);
    const BATCH = 20;
    for (let i = 0; i < names.length; i += BATCH) {
      const batch = names.slice(i, i + BATCH);
      const queryToOrig = {};
      batch.forEach(n => {
        queryToOrig[n.replace(/ /g, '_')] = n;
        queryToOrig[n] = n;
      });
      try {
        const titles = batch.map(n => n.replace(/ /g, '_')).join('|');
        const url = `https://en.wikipedia.org/w/api.php?action=query&titles=${encodeURIComponent(titles)}&prop=pageimages&pithumbsize=240&format=json&origin=*&redirects=`;
        const resp = await fetch(url);
        const data = await resp.json();
        const q = data.query;
        const finalToOrig = {...queryToOrig};
        (q.normalized || []).forEach(({from, to}) => {
          const orig = finalToOrig[from];
          if (orig) finalToOrig[to] = orig;
        });
        (q.redirects || []).forEach(({from, to}) => {
          const orig = finalToOrig[from];
          if (orig) finalToOrig[to] = orig;
        });
        Object.values(q.pages || {}).forEach(page => {
          if (!page.thumbnail) return;
          const orig = finalToOrig[page.title];
          if (!orig) return;
          photoCache.set(orig, page.thumbnail.source);
          const el = photoElMap.get(orig);
          if (!el || !el.parentNode) return;
          const img = document.createElement('img');
          img.className = 'sp-photo';
          img.src = page.thumbnail.source;
          img.alt = orig;
          img.onerror = () => {};
          img.onload = () => {
            if (el.parentNode) { el.replaceWith(img); photoElMap.set(orig, img); }
          };
        });
      } catch(e) {}
      if (i + BATCH < names.length) await new Promise(r => setTimeout(r, 150));
    }
  }
  loadPhotos();
  </script>
</body>
</html>
